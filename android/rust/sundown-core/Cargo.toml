[package]
name = "sundown-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
uniffi = { version = "0.28", features = ["tokio"] }
lofty = "0.21" # Rebuilt with Lofty for 10x format support
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13" # Index compression
rayon = "1.10" # GPU-style parallel processing on CPU

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
