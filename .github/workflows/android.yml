name: Android Rebuild CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native Rebuild Build & Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 26.3.11579264

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Core
        run: |
          cd android/rust/sundown-core
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android -o ../../app/src/main/jniLibs build --release

      - name: Assemble Debug APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Provision Release Key (Signed at all costs)
        id: release_key
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using existing repository secrets."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "pass=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "alias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "key_pass=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "Secrets missing. Generating a project-stable release key..."
            # Use REPOSITORY_ID as a stable seed for the password
            STABLE_PW="pw${{ github.repository_id }}stable"
            ALIAS="sundown-v1"
            # Generate key using keytool (available in CI images)
            keytool -genkeypair -v -keystore android/app/release.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STABLE_PW" -keypass "$STABLE_PW" \
              -dname "CN=Sundown Release, OU=V1, O=Nazatric, L=Remote, ST=Cloud, C=US"
            echo "pass=$STABLE_PW" >> $GITHUB_OUTPUT
            echo "alias=$ALIAS" >> $GITHUB_OUTPUT
            echo "key_pass=$STABLE_PW" >> $GITHUB_OUTPUT
            echo "::warning::Signed with auto-generated key. Download 'release-keystore' artifact to save it."
          fi

      - name: Assemble SIGNED Universal Release APK
        working-directory: android
        env:
          SUNDOWN_STORE_FILE: release.keystore
          SUNDOWN_STORE_PASSWORD: ${{ steps.release_key.outputs.pass }}
          SUNDOWN_KEY_ALIAS: ${{ steps.release_key.outputs.alias }}
          SUNDOWN_KEY_PASSWORD: ${{ steps.release_key.outputs.key_pass }}
        run: gradle :app:assembleRelease

      - name: Verify APK Signature (apksigner)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK"
          echo "Signature verified successfully."

      - name: Archive Release Keystore
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: android/app/release.keystore

      - name: Verify Universal APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          unzip -l $APK | grep "libsundown_core.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sundown-Universal-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
