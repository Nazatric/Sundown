name: Android Rebuild CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native Rebuild Build & Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 26.3.11579264

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Core
        run: |
          cd android/rust/sundown-core
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android -o ../../app/src/main/jniLibs build --release

      - name: Assemble Debug APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Check Release Secrets
        id: release_check
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Keystore
        if: steps.release_check.outputs.configured == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Assemble Signed Release APK
        if: steps.release_check.outputs.configured == 'true'
        working-directory: android
        env:
          SUNDOWN_STORE_FILE: release.keystore
          SUNDOWN_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SUNDOWN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUNDOWN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify Universal APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          unzip -l $APK | grep "libsundown_core.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sundown-Universal-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
